name: Compilar Grana no Volante Oficial (Versao 3)

on:
  push:
    branches: [ main, principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixa o codigo
        uses: actions/checkout@v4

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configura Android SDK 36
        uses: android-actions/setup-android@v3

      - name: Instala plataforma Android 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Configura Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Compila Pacote Oficial AAB e APK
        run: gradle bundleRelease assembleRelease --stacktrace

      - name: Guarda AAB Oficial para Play Store
        uses: actions/upload-artifact@v4
        with:
          name: GranaNoVolante-V3-Oficial-AAB
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Guarda APK de Teste
        uses: actions/upload-artifact@v4
        with:
          name: GranaNoVolante-V3-Teste-APK
          path: app/build/outputs/apk/release/app-release.apk
