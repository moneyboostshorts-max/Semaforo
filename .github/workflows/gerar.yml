name: Gerar AAB e APK Grana no Volante Oficial (Versao 3)
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Baixa plataforma Android 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - run: gradle bundleRelease assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GranaNoVolante-V3-Oficial-AAB
          path: app/build/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v4
        with:
          name: GranaNoVolante-V3-Teste-APK
          path: app/build/outputs/apk/release/*.apk
