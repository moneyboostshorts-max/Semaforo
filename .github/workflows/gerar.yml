name: Gerar Instalador do Semaforo
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar codigo fonte completo
        run: |
          curl -L -o semaforo.zip "https://grananovolanteapk.lovable.app/semaforo-source.zip" || true
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Gerar APK
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace || true
      - name: Disponibilizar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Semaforo-Instalador
          path: app/build/outputs/apk/debug/*.apk
