name: Compilar Grana no Volante Oficial (Versao 2)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar codigo
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Dar permissao ao Gradle
      run: chmod +x gradlew

    - name: Compilar AAB Oficial (Play Store) e APK de Teste
      run: ./gradlew bundleRelease assembleRelease --no-daemon

    - name: Salvar AAB Oficial para a Google Play
      uses: actions/upload-artifact@v4
      with:
        name: GranaNoVolante-V2-Oficial-AAB
        path: app/build/outputs/bundle/release/*.aab

    - name: Salvar APK de Teste para o Celular
      uses: actions/upload-artifact@v4
      with:
        name: GranaNoVolante-V2-Teste-APK
        path: app/build/outputs/apk/release/*.apk
